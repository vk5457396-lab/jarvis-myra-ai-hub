<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#241014"/>
      <stop offset="55%" stop-color="#150a0d"/>
      <stop offset="100%" stop-color="#0a0607"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="30%" stop-color="#dc2626"/>
      <stop offset="75%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1116"/>
      <stop offset="100%" stop-color="#1c0a0c"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#dc2626" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="980" cy="120" r="260" fill="url(#glow)"/>
  <circle cx="120" cy="560" r="220" fill="url(#glow)"/>

  <!-- corner accents -->
  <path d="M40 100 V44 H96" fill="none" stroke="#dc2626" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M1160 100 V44 H1104" fill="none" stroke="#dc2626" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M40 530 V586 H96" fill="none" stroke="#dc2626" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M1160 530 V586 H1104" fill="none" stroke="#dc2626" stroke-opacity="0.5" stroke-width="2"/>

  <!-- eyebrow chip -->
  <rect x="80" y="96" width="286" height="40" rx="20" fill="url(#chipGrad)" stroke="#dc2626" stroke-opacity="0.45"/>
  <circle cx="106" cy="116" r="5" fill="#4ade80"/>
  <text x="122" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#f5b5b5">FULL SOURCE CODE</text>

  <!-- title -->
  <text x="80" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="900" fill="url(#titleGrad)">MYRA</text>
  <text x="80" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#f5f5f5">Android Source Code</text>

  <text x="82" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#c9b3b3">Complete Android Studio (Kotlin) project - own the entire codebase.</text>

  <!-- feature chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#f0dede">
    <rect x="80" y="400" width="150" height="42" rx="10" fill="#1c0a0c" stroke="#dc2626" stroke-opacity="0.35"/>
    <text x="102" y="427">Kotlin + XML</text>

    <rect x="242" y="400" width="176" height="42" rx="10" fill="#1c0a0c" stroke="#dc2626" stroke-opacity="0.35"/>
    <text x="264" y="427">Voice AI Engine</text>

    <rect x="430" y="400" width="188" height="42" rx="10" fill="#1c0a0c" stroke="#dc2626" stroke-opacity="0.35"/>
    <text x="452" y="427">Firebase Backend</text>

    <rect x="630" y="400" width="160" height="42" rx="10" fill="#1c0a0c" stroke="#dc2626" stroke-opacity="0.35"/>
    <text x="652" y="427">Lifetime Use</text>
  </g>

  <!-- price badge -->
  <g transform="translate(80,470)">
    <rect width="300" height="90" rx="18" fill="url(#badgeGrad)"/>
    <text x="24" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#e7ffee">ONE-TIME PRICE</text>
    <text x="24" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="900" fill="#ffffff">&#8377;59,999</text>
  </g>

  <!-- phone / code glyph on the right -->
  <g transform="translate(880,150)">
    <rect x="0" y="0" width="220" height="340" rx="32" fill="#120809" stroke="#dc2626" stroke-opacity="0.55" stroke-width="3"/>
    <rect x="14" y="34" width="192" height="272" rx="10" fill="#1a0c0e"/>
    <circle cx="110" cy="18" r="4" fill="#dc2626"/>
    <text x="32" y="70" font-family="Consolas, monospace" font-size="15" fill="#4ade80">fun onWake() {</text>
    <text x="46" y="96" font-family="Consolas, monospace" font-size="15" fill="#f5b5b5">listen()</text>
    <text x="46" y="122" font-family="Consolas, monospace" font-size="15" fill="#f5b5b5">respond()</text>
    <text x="32" y="148" font-family="Consolas, monospace" font-size="15" fill="#4ade80">}</text>
    <text x="32" y="188" font-family="Consolas, monospace" font-size="15" fill="#93c5fd">class MyraAI {</text>
    <text x="46" y="214" font-family="Consolas, monospace" font-size="15" fill="#e5e5e5">// full source</text>
    <text x="46" y="240" font-family="Consolas, monospace" font-size="15" fill="#e5e5e5">// included</text>
    <text x="32" y="266" font-family="Consolas, monospace" font-size="15" fill="#93c5fd">}</text>
    <rect x="86" y="316" width="48" height="6" rx="3" fill="#dc2626" fill-opacity="0.6"/>
  </g>

  <text x="900" y="530" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#f5f5f5" text-anchor="middle">codeninjavik.in</text>
</svg>
